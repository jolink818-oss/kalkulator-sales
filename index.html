<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalkulator Sales Sekolah</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#128C7E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sales Calc">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/000000/calculator.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/96/000000/calculator.png">
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --subtext-color: #555555;
            --border-color: #cccccd;
            --primary-color: #128C7E;
            --accent-green: #25D366;
            --total-bg: #e8f5e9;
            --total-text: #128C7E;
            --input-bg: #ffffff;
            --dashed-border: #a5d6a7;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --subtext-color: #aaa;
            --border-color: #333;
            --primary-color: #00bfa5;
            --accent-green: #00e676;
            --total-bg: #1b2e2b;
            --total-text: #00e676;
            --input-bg: #2a2a2a;
            --dashed-border: #2e524a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: var(--text-color);
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header-bar {
            max-width: 500px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .theme-toggle-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto 20px auto;
            transition: background-color 0.3s ease;
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        label {
            font-weight: bold;
            font-size: 0.85rem;
            display: block;
            margin-top: 10px;
            color: var(--subtext-color);
        }

        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        /* Supaya ikon kalendar nampak jelas dalam mod gelap/cerah */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(0.5);
        }
        body.dark-mode input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        .denomination-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .denomination-row label {
            width: 70px;
            margin-top: 0;
        }

        .denomination-row input {
            width: 100px;
            text-align: right;
        }

        .denomination-row .subtotal {
            width: 110px;
            text-align: right;
            font-weight: bold;
            color: var(--accent-green);
            font-size: 0.9rem;
        }

        .total-box {
            background-color: var(--total-bg);
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .total-box div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .total-box .grand-total {
            font-size: 1.1rem;
            color: var(--total-text);
            border-top: 1px dashed var(--dashed-border);
            padding-top: 5px;
            margin-top: 5px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button.btn-main {
            flex: 1;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }

        button.btn-reset {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            flex: 0.4;
        }

        button:hover {
            opacity: 0.9;
        }

        textarea {
            width: 100%;
            height: 220px;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="header-bar">
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
</div>

<div class="card">
    <h2>Maklumat Jualan</h2>
    
    <label>Nama Sekolah / Catatan Header</label>
    <input type="text" id="school" placeholder="cth: SK Seri Perdana (1,500) Day 1" oninput="saveData()">
    
    <label>Tarikh</label>
    <input type="date" id="datePicker" onchange="saveData()">

    <label>Sales Executives</label>
    <input type="text" id="executives" placeholder="cth: Shakhir, Azwa & Syu" oninput="saveData()">
</div>

<div class="card">
    <h2>Kira Wang Tunai</h2>
    
    <div class="denomination-row">
        <label>RM 1</label>
        <input type="number" id="pcs1" placeholder="0" oninput="calculate(); saveData();">
        <span class="subtotal" id="sub1">RM 0</span>
    </div>
    <div class="denomination-row">
        <label>RM 5</label>
        <input type="number" id="pcs5" placeholder="0" oninput="calculate(); saveData();">
        <span class="subtotal" id="sub5">RM 0</span>
    </div>
    <div class="denomination-row">
        <label>RM 10</label>
        <input type="number" id="pcs10" placeholder="0" oninput="calculate(); saveData();">
        <span class="subtotal" id="sub10">RM 0</span>
    </div>
    <div class="denomination-row">
        <label>RM 20</label>
        <input type="number" id="pcs20" placeholder="0" oninput="calculate(); saveData();">
        <span class="subtotal" id="sub20">RM 0</span>
    </div>
    <div class="denomination-row">
        <label>RM 50</label>
        <input type="number" id="pcs50" placeholder="0" oninput="calculate(); saveData();">
        <span class="subtotal" id="sub50">RM 0</span>
    </div>
    <div class="denomination-row">
        <label>RM 100</label>
        <input type="number" id="pcs100" placeholder="0" oninput="calculate(); saveData();">
        <span class="subtotal" id="sub100">RM 0</span>
    </div>

    <label>Syiling / Cents (RM)</label>
    <input type="number" id="centsVal" placeholder="0.00" step="0.01" oninput="calculate(); saveData();">

    <label>Jualan QR (RM)</label>
    <input type="number" id="qrVal" placeholder="0.00" step="0.01" oninput="calculate(); saveData();">

    <div class="total-box">
        <div><span>Jumlah Cash (Kertas):</span> <span id="txtPaperCash">RM 0.00</span></div>
        <div><span>Cents:</span> <span id="txtCents">RM 0.00</span></div>
        <div><span>Jumlah Cash Keseluruhan:</span> <span id="txtTotalCash">RM 0.00</span></div>
        <div><span>Jumlah QR:</span> <span id="txtQR">RM 0.00</span></div>
        <div class="grand-total"><span>TOTAL KESELURUHAN:</span> <span id="txtGrand">RM 0.00</span></div>
    </div>

    <div class="btn-group">
        <button type="button" class="btn-reset" onclick="resetForm()">Reset</button>
        <button type="button" class="btn-main" onclick="generateReport()">Jana & Copy Report</button>
    </div>
</div>

<div class="card" id="reportSection" style="display:none;">
    <h2>Hasil Report (Format WhatsApp)</h2>
    <textarea id="reportOutput" readonly></textarea>
    <button type="button" class="btn-main" onclick="copyToClipboard()" style="background-color: #075E54; width: 100%; margin-top: 10px;">Salin Teks Report</button>
</div>

<script>
    // Theme Toggle Logic
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        document.getElementById('themeBtn').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
        localStorage.setItem('salesCalcTheme', isDark ? 'dark' : 'light');
    }

    (function initTheme() {
        const savedTheme = localStorage.getItem('salesCalcTheme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.body.classList.add('dark-mode');
            document.getElementById('themeBtn').innerText = '☀️ Light Mode';
        }
    })();

    // Auto-Save Data to LocalStorage
    function saveData() {
        const data = {
            school: document.getElementById('school').value,
            datePicker: document.getElementById('datePicker').value,
            executives: document.getElementById('executives').value,
            pcs1: document.getElementById('pcs1').value,
            pcs5: document.getElementById('pcs5').value,
            pcs10: document.getElementById('pcs10').value,
            pcs20: document.getElementById('pcs20').value,
            pcs50: document.getElementById('pcs50').value,
            pcs100: document.getElementById('pcs100').value,
            centsVal: document.getElementById('centsVal').value,
            qrVal: document.getElementById('qrVal').value
        };
        localStorage.setItem('salesCalcSavedData', JSON.stringify(data));
    }

    // Load Saved Data on Startup
    function loadSavedData() {
        const saved = localStorage.getItem('salesCalcSavedData');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                document.getElementById('school').value = data.school || '';
                document.getElementById('datePicker').value = data.datePicker || '';
                document.getElementById('executives').value = data.executives || '';
                document.getElementById('pcs1').value = data.pcs1 || '';
                document.getElementById('pcs5').value = data.pcs5 || '';
                document.getElementById('pcs10').value = data.pcs10 || '';
                document.getElementById('pcs20').value = data.pcs20 || '';
                document.getElementById('pcs50').value = data.pcs50 || '';
                document.getElementById('pcs100').value = data.pcs100 || '';
                document.getElementById('centsVal').value = data.centsVal || '';
                document.getElementById('qrVal').value = data.qrVal || '';
            } catch(e) {}
        } else {
            // Set default date ke hari ini jika kosong
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('datePicker').value = today;
        }
        calculate();
    }

    function calculate() {
        let p1 = parseFloat(document.getElementById('pcs1').value) || 0;
        let p5 = parseFloat(document.getElementById('pcs5').value) || 0;
        let p10 = parseFloat(document.getElementById('pcs10').value) || 0;
        let p20 = parseFloat(document.getElementById('pcs20').value) || 0;
        let p50 = parseFloat(document.getElementById('pcs50').value) || 0;
        let p100 = parseFloat(document.getElementById('pcs100').value) || 0;

        let cents = parseFloat(document.getElementById('centsVal').value) || 0;
        let qr = parseFloat(document.getElementById('qrVal').value) || 0;

        let v1 = p1 * 1;
        let v5 = p5 * 5;
        let v10 = p10 * 10;
        let v20 = p20 * 20;
        let v50 = p50 * 50;
        let v100 = p100 * 100;

        document.getElementById('sub1').innerText = "RM " + v1.toLocaleString('en-US');
        document.getElementById('sub5').innerText = "RM " + v5.toLocaleString('en-US');
        document.getElementById('sub10').innerText = "RM " + v10.toLocaleString('en-US');
        document.getElementById('sub20').innerText = "RM " + v20.toLocaleString('en-US');
        document.getElementById('sub50').innerText = "RM " + v50.toLocaleString('en-US');
        document.getElementById('sub100').innerText = "RM " + v100.toLocaleString('en-US');

        let paperCashTotal = v1 + v5 + v10 + v20 + v50 + v100;
        let totalCash = paperCashTotal + cents;
        let grandTotal = totalCash + qr;

        document.getElementById('txtPaperCash').innerText = "RM " + paperCashTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('txtCents').innerText = "RM " + cents.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('txtTotalCash').innerText = "RM " + totalCash.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('txtQR').innerText = "RM " + qr.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('txtGrand').innerText = "RM " + grandTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

        return { p1, p5, p10, p20, p50, p100, v1, v5, v10, v20, v50, v100, paperCashTotal, cents, totalCash, qr, grandTotal };
    }

    function resetForm() {
        if (confirm("Adakah anda pasti untuk reset SEMUA maklumat jualan?")) {
            localStorage.removeItem('salesCalcSavedData');
            
            document.getElementById('school').value = "";
            document.getElementById('executives').value = "";
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('datePicker').value = today;

            document.getElementById('pcs1').value = "";
            document.getElementById('pcs5').value = "";
            document.getElementById('pcs10').value = "";
            document.getElementById('pcs20').value = "";
            document.getElementById('pcs50').value = "";
            document.getElementById('pcs100').value = "";
            document.getElementById('centsVal').value = "";
            document.getElementById('qrVal').value = "";
            
            document.getElementById('reportSection').style.display = 'none';
            calculate();
        }
    }

    // Fungsi Format Tarikh ke Bahasa Malaysia & Hari Automatik
    function formatTarikhBM(dateString) {
        if (!dateString) return "";
        const dateObj = new Date(dateString);
        
        const hariArr = ['AHAD', 'ISNIN', 'SELASA', 'RABU', 'KHAMIS', 'JUMAAT', 'SABTU'];
        const bulanArr = ['JANUARI', 'FEBRUARI', 'MAC', 'APRIL', 'MEI', 'JUN', 'JULAI', 'OGOS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DISEMBER'];
        
        const hari = hariArr[dateObj.getDay()];
        const hariNum = String(dateObj.getDate()).padStart(2, '0');
        const bulan = bulanArr[dateObj.getMonth()];
        const tahun = dateObj.getFullYear();

        return `${hariNum}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${tahun} - ${hari}`;
    }

    function generateReport() {
        let data = calculate();
        let school = document.getElementById('school').value;
        let rawDate = document.getElementById('datePicker').value;
        let dateStr = formatTarikhBM(rawDate);
        let executives = document.getElementById('executives').value;

        function fmt(num) {
            return num.toLocaleString('en-US');
        }

        function fmtDec(num) {
            return num.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        let paperLines = [];
        if (data.p1 > 0) paperLines.push(`RM 1: ${fmt(data.p1)} pcs (RM${fmt(data.v1)})`);
        if (data.p5 > 0) paperLines.push(`RM 5: ${fmt(data.p5)} pcs (RM${fmt(data.v5)})`);
        if (data.p10 > 0) paperLines.push(`RM 10: ${fmt(data.p10)} pcs (RM${fmt(data.v10)})`);
        if (data.p20 > 0) paperLines.push(`RM 20: ${fmt(data.p20)} pcs (RM${fmt(data.v20)})`);
        if (data.p50 > 0) paperLines.push(`RM 50: ${fmt(data.p50)} pcs (RM${fmt(data.v50)})`);
        if (data.p100 > 0) paperLines.push(`RM 100: ${fmt(data.p100)} pcs (RM${fmt(data.v100)})`);

        let reportText = "";
        
        if (school) reportText += `*${school.toUpperCase()}*\n`;
        if (dateStr) reportText += `${dateStr}\n\n`;
        
        if (executives) {
            reportText += `*Sales Executives:*\n(${executives})\n\n`;
        }

        if (paperLines.length > 0) {
            reportText += paperLines.join("\n") + "\n";
            reportText += `= *RM ${fmtDec(data.paperCashTotal)}*\n\n`;
        }

        if (data.cents > 0) {
            reportText += `*Cents : RM ${fmtDec(data.cents)}*\n\n`;
        }

        reportText += `*Cash* : *RM ${fmtDec(data.totalCash)}*\n`;
        
        if (data.qr > 0) {
            reportText += `*QR : RM ${fmtDec(data.qr)}*\n`;
        }

        reportText += `\n*Total* :\n *RM ${fmtDec(data.grandTotal)}*`;

        document.getElementById('reportOutput').value = reportText;
        document.getElementById('reportSection').style.display = 'block';
        
        // Salin terus tanpa pop-up alert
        let copyText = document.getElementById("reportOutput");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value);
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(()=>{});
        });
    }

    // Jalankan pemuatan data yang tersimpan semasa app dibuka
    loadSavedData();
</script>

</body>
</html>
